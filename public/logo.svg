<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48" aria-label="GlanceIt Logo">
  <!-- Outer lens ring (CCTV camera lens metaphor) -->
  <circle cx="24" cy="24" r="22" stroke="#ff1938" stroke-width="2" fill="#09090b"/>
  <!-- Inner lens ring (golden ratio proportion) -->
  <circle cx="24" cy="24" r="15" stroke="#ff1938" stroke-width="1" stroke-opacity="0.4" fill="none"/>
  <!-- Aperture dot -->
  <circle cx="24" cy="24" r="4.5" fill="#ff1938" opacity="0.15"/>
  <!-- G letterform — bold, geometric, centered -->
  <text
    x="24"
    y="30"
    text-anchor="middle"
    font-family="Syne, system-ui, sans-serif"
    font-weight="900"
    font-size="20"
    fill="#ff1938"
    letter-spacing="-0.5"
  >G</text>
  <!-- Corner tick marks (surveillance grid reference) -->
  <line x1="6" y1="6" x2="10" y2="6" stroke="#ff1938" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="6" y1="6" x2="6" y2="10" stroke="#ff1938" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="42" y1="6" x2="38" y2="6" stroke="#ff1938" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="42" y1="6" x2="42" y2="10" stroke="#ff1938" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="6" y1="42" x2="10" y2="42" stroke="#ff1938" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="6" y1="42" x2="6" y2="38" stroke="#ff1938" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="42" y1="42" x2="38" y2="42" stroke="#ff1938" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="42" y1="42" x2="42" y2="38" stroke="#ff1938" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
